name: PROD Pre-Checks

on:
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Read DEV image
        id: image
        run: |
          DEV_IMAGE=$(grep 'image:' k8s/dev/deployment.yaml | awk '{print $2}')

          if [ -z "$DEV_IMAGE" ]; then
            echo "DEV image not found"
            exit 1
          fi

          echo "Candidate image: $DEV_IMAGE"
          echo "image=$DEV_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate promotion candidate exists
        run: |
          docker manifest inspect "${{ steps.image.outputs.image }}"