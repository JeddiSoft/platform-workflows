name: PROD Promotion

on:
  workflow_call:

jobs:
  promote:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:

      - name: Generate platform automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Read image deployed in DEV
        id: image
        run: |
          DEV_IMAGE=$(grep 'image:' k8s/dev/deployment.yaml | awk '{print $2}')

          echo "Promoting image: $DEV_IMAGE"
          echo "image=$DEV_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image exists
        run: |
          docker manifest inspect "${{ steps.image.outputs.image }}"

      - name: Update PROD manifest
        run: |
          sed -i \
            "s|image: .*|image: ${{ steps.image.outputs.image }}|" \
            k8s/prod/deployment.yaml

      - name: Commit PROD promotion
        run: |
          git config user.name "jeddisoft-platform-automation[bot]"
          git config user.email "jeddisoft-platform-automation[bot]@users.noreply.github.com"

          git add k8s/prod/deployment.yaml

          git diff --cached --quiet || \
            git commit -m "chore: promote image to prod"

          git push